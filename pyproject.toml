[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyvern-hsi-labs"
version = "0.1.0"
description = "Hyperspectral remote sensing analysis pipelines for Wyvern Dragonette open data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "rasterio",
  "numpy",
  "matplotlib",
  "scipy",
  "scikit-learn",
  "scikit-image",
  "pandas",
  "pystac",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100