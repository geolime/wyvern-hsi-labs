project:
  name: water_quality
  random_seed: 42

pipeline:
  stages:
    - convert.py
    - water_mask.py
    - pca_kmeans_water.py
    - proxy_map_ndti_ndci.py
    - composite_proxy_map.py
    - export_previews.py

masking:
  green_nm: 549.0
  red_nm: 660.0
  nir_nm: 764.0
  rgb_nm: [660.0, 549.0, 510.0]
  ndwi_min: 0.15
  ndvi_max: 0.10
  nir_percentile: 35.0
  red_percentile: 55.0
  percentile_lo: 2.0
  percentile_hi: 98.0

clustering:
  k: 5
  pca_components: 8
  n_samples: 200000
  tile_size: 512
  sample_silhouette: 80000
  stability_runs: 6

proxies:
  ndti_green_nm: 570.0
  ndti_red_nm: 660.0
  ndci_red_edge_nm: 711.0
  ndci_red_nm: 669.0
  ngb_nm: [764.0, 549.0, 510.0]
  percentile_lo: 2.0
  percentile_hi: 98.0
  hotspot_top_pct: 10.0
  n_bins: 3
  composite_w_ndti: 1.0
  composite_w_ndci: 1.0
  composite_hotspot_top_pct: 5.0
  state_split_pct: 50.0

sfa:
  ndti_green_nm: 570.0
  ndti_red_nm: 660.0
  ndci_red_edge_nm: 711.0
  ndci_red_nm: 669.0
  nir_red_nir_nm: 764.0
  nir_red_red_nm: 669.0
  rgb_nm: [660.0, 549.0, 510.0]
  ngb_nm: [764.0, 549.0, 510.0]